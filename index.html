<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>void software</title>
    <meta name="description" content="void software" />
    <meta name="author" content="void software" />

    <!-- Favicon: rutas relativas para que funcionen con HTTPS en cualquier dominio -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Fuentes: font-display (Space Grotesk) y font-body (Inter) de tailwind.config.ts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
    />

    <!-- Open Graph (Facebook/Meta) - dominio void-ia.com -->
    <meta property="og:title" content="void software" />
    <meta property="og:description" content="void software" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://void-ia.com/" />
    <meta property="og:image" content="https://void-ia.com/logo.png" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="void software" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="void software" />
    <meta name="twitter:description" content="void software" />
    <meta name="twitter:image" content="https://void-ia.com/logo.png" />

    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Deshace el redirect armado en public/404.html antes de que monte React Router.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
